<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Car Dashboard</title>
<style>
:root{--bg:#070a0f;--panel:#0d121a;--line:#202936;--text:#eef3f8;--muted:#8793a3;--accent:#56d6ff;--warn:#ffb84d}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;padding:12px;gap:10px}
header{display:flex;justify-content:space-between;align-items:center;height:42px}
#time{font-size:30px;font-weight:700;letter-spacing:.5px}#date{font-size:12px;color:var(--muted)}
.badge{padding:6px 9px;border:1px solid var(--line);border-radius:10px;color:var(--muted);font-size:11px}
main{flex:1;min-height:0;display:grid;grid-template-columns:1.1fr .9fr;grid-template-rows:1fr 1fr;gap:10px}
.card{background:linear-gradient(145deg,#0d131c,#090d13);border:1px solid var(--line);border-radius:18px;padding:14px;min-height:0}
.speed{grid-row:1/3;display:flex;flex-direction:column;align-items:center;justify-content:center}
.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px}
#speed{font-size:min(24vw,145px);font-weight:800;line-height:.9;margin:12px 0 5px}
.unit{font-size:20px;color:var(--muted)}
.row{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.metric{text-align:center;flex:1}.value{font-size:22px;font-weight:700;margin-top:4px}
#map{height:100%;width:100%;border-radius:12px;background:#111821;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;text-align:center}
.coords{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--muted);line-height:1.6}
footer{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;height:64px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;text-align:center}.tile b{display:block;font-size:16px;margin-top:4px}.tile span{font-size:10px;color:var(--muted)}
button{position:fixed;right:14px;bottom:84px;background:#18212d;color:white;border:1px solid #2a394b;border-radius:12px;padding:9px 12px;font-size:12px}
@media(max-width:650px){body{padding:9px}main{grid-template-columns:1fr 1fr;grid-template-rows:1.15fr .85fr}.speed{grid-row:1}.mapcard{grid-column:1/3}.speed #speed{font-size:min(28vw,105px)}}
</style>
</head>
<body>
<header>
  <div><div id="time">--:--</div><div id="date">—</div></div>
  <div class="badge" id="gpsStatus">GPS: αναμονή</div>
</header>

<main>
  <section class="card speed">
    <div class="label">GPS SPEED</div>
    <div id="speed">0</div><div class="unit">km/h</div>
    <div class="row">
      <div class="metric"><div class="label">HEADING</div><div class="value" id="heading">—</div></div>
      <div class="metric"><div class="label">ALT</div><div class="value" id="alt">—</div></div>
    </div>
    <div class="coords" id="coords" style="margin-top:16px;text-align:center">GPS coordinates: —</div>
  </section>

  <section class="card">
    <div class="label">SENSORS</div>
    <div class="row">
      <div class="metric"><div class="label">PITCH</div><div class="value" id="pitch">—</div></div>
      <div class="metric"><div class="label">ROLL</div><div class="value" id="roll">—</div></div>
    </div>
    <div class="row">
      <div class="metric"><div class="label">ACCURACY</div><div class="value" id="accuracy">—</div></div>
      <div class="metric"><div class="label">G</div><div class="value" id="gforce">—</div></div>
    </div>
  </section>

  <section class="card mapcard"><div id="map">Ο χάρτης θα ανοίξει όταν υπάρχει GPS θέση.</div></section>
</main>

<footer>
  <div class="tile"><span>WEATHER</span><b id="weather">—</b></div>
  <div class="tile"><span>SUNSET</span><b id="sunset">—</b></div>
  <div class="tile"><span>LAT</span><b id="lat">—</b></div>
  <div class="tile"><span>LON</span><b id="lon">—</b></div>
</footer>

<button id="start">Ενεργοποίηση αισθητήρων</button>

<script>
const $=id=>document.getElementById(id);
function clock(){
 const d=new Date();
 $("time").textContent=d.toLocaleTimeString("el-GR",{hour:"2-digit",minute:"2-digit"});
 $("date").textContent=d.toLocaleDateString("el-GR",{weekday:"long",day:"2-digit",month:"long"});
}
setInterval(clock,1000);clock();

let lastPos=null;
function compass(deg){
 if(deg==null||isNaN(deg)) return "—";
 const dirs=["N","NE","E","SE","S","SW","W","NW"];
 return dirs[Math.round(deg/45)%8]+" "+Math.round(deg)+"°";
}
function gpsSuccess(p){
 lastPos=p;
 const c=p.coords;
 const kmh=(typeof c.speed==="number" && c.speed>=0)?c.speed*3.6:0;
 $("speed").textContent=Math.round(kmh);
 $("heading").textContent=compass(c.heading);
 $("alt").textContent=c.altitude==null?"—":Math.round(c.altitude)+" m";
 $("accuracy").textContent=c.accuracy?Math.round(c.accuracy)+" m":"—";
 $("coords").textContent=`${c.latitude.toFixed(5)}, ${c.longitude.toFixed(5)}`;
 $("lat").textContent=c.latitude.toFixed(3);
 $("lon").textContent=c.longitude.toFixed(3);
 $("gpsStatus").textContent="GPS: ενεργό";
 const url=`https://www.openstreetmap.org/export/embed.html?bbox=${c.longitude-.008}%2C${c.latitude-.005}%2C${c.longitude+.008}%2C${c.latitude+.005}&layer=mapnik&marker=${c.latitude}%2C${c.longitude}`;
 $("map").innerHTML=`<iframe title="map" style="width:100%;height:100%;border:0;border-radius:12px" src="${url}"></iframe>`;
}
function gpsError(e){$("gpsStatus").textContent="GPS: "+e.message;$("speed").textContent="—";}
if(navigator.geolocation){
 navigator.geolocation.watchPosition(gpsSuccess,gpsError,{enableHighAccuracy:true,maximumAge:1000,timeout:10000});
}

function orientation(e){
 let pitch=e.beta, roll=e.gamma;
 if(pitch!=null) $("pitch").textContent=Math.round(pitch)+"°";
 if(roll!=null) $("roll").textContent=Math.round(roll)+"°";
 if(e.alpha!=null && $("heading").textContent==="—") $("heading").textContent=compass(360-e.alpha);
}
function motion(e){
 const a=e.accelerationIncludingGravity;
 if(!a)return;
 const g=Math.sqrt((a.x||0)**2+(a.y||0)**2+(a.z||0)**2)/9.80665;
 $("gforce").textContent=g.toFixed(2)+" G";
}
async function sensors(){
 try{
   if(DeviceMotionEvent?.requestPermission) await DeviceMotionEvent.requestPermission();
   if(DeviceOrientationEvent?.requestPermission) await DeviceOrientationEvent.requestPermission();
 }catch(err){}
 window.addEventListener("deviceorientation",orientation,true);
 window.addEventListener("devicemotion",motion,true);
 $("start").textContent="Αισθητήρες ενεργοί";
 $("start").disabled=true;
}
$("start").onclick=sensors;

async function weather(){
 if(!lastPos)return setTimeout(weather,3000);
 const {latitude,longitude}=lastPos.coords;
 try{
   const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,weather_code&daily=sunset&timezone=auto&forecast_days=1`);
   const d=await r.json();
   $("weather").textContent=Math.round(d.current.temperature_2m)+"°C";
   $("sunset").textContent=new Date(d.daily.sunset[0]).toLocaleTimeString("el-GR",{hour:"2-digit",minute:"2-digit"});
 }catch(e){$("weather").textContent="—";}
}
setInterval(weather,60000);weather();
</script>
</body>
</html>
